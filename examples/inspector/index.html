<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b14" />
    <title>SpatialKit</title>
    <meta name="description" content="SpatialKit — Interactive 3D component kit for React." />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph / Meta Link Preview Icons -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SpatialKit" />
    <meta property="og:title" content="SpatialKit — Interactive 3D Component Kit for React" />
    <meta property="og:description" content="Precision 3D canvas, tactile controls, exploded views, cross-section slicing, and spatial annotations for React." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:type" content="image/png" />

    <!-- Twitter Card Meta Icons -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SpatialKit — Interactive 3D Component Kit for React" />
    <meta name="twitter:description" content="Precision 3D canvas, tactile controls, exploded views, cross-section slicing, and spatial annotations for React." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Apply saved theme before React renders to prevent flash -->
    <script>
      try {
        var t = localStorage.getItem('sk-theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
        else if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
      } catch(e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
