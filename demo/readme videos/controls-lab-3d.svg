<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="220" fill="none">
  <defs>
    <linearGradient id="labBg" x1="0" y1="0" x2="920" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060b16" />
      <stop offset="100%" stop-color="#0b1528" />
    </linearGradient>
    <style>
      .card-box { fill: rgba(15, 23, 42, 0.85); stroke: rgba(148, 163, 184, 0.2); stroke-width: 1.2; }
      .card-label { font: 700 10px 'Courier New', monospace; fill: #58ddba; letter-spacing: 1px; }
      .card-sub { font: 500 10.5px 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; }
      .scrub-anim { animation: scrubMove 3.2s ease-in-out infinite; }
      .lift-anim { animation: liftMove 3.4s ease-in-out infinite; }
      .dial-anim { transform-origin: 575px 106px; animation: dialTurn 4.5s ease-in-out infinite; }
      .joy-anim { animation: joyMove 3.8s ease-in-out infinite; }
      @keyframes scrubMove {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(84px); }
      }
      @keyframes liftMove {
        0%, 100% { transform: translateY(20px); }
        50% { transform: translateY(-22px); }
      }
      @keyframes dialTurn {
        0%, 100% { transform: rotate(-60deg); }
        50% { transform: rotate(125deg); }
      }
      @keyframes joyMove {
        0%, 100% { transform: translate(-10px, -6px); }
        33% { transform: translate(12px, -8px); }
        66% { transform: translate(6px, 11px); }
      }
    </style>
  </defs>

  <rect width="920" height="220" rx="14" fill="url(#labBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Card 1: Mechanical Timeline Scrubber -->
  <g transform="translate(20, 20)">
    <rect width="205" height="180" rx="10" class="card-box" />
    <text x="16" y="26" class="card-label">01 · TIMELINE SCRUBBER</text>
    <rect x="28" y="84" width="148" height="10" rx="5" fill="#090f1d" stroke="#334155" stroke-width="1.5" />
    <g class="scrub-anim">
      <rect x="34" y="72" width="28" height="34" rx="6" fill="#58ddba" stroke="#0f172a" stroke-width="2" />
      <line x1="45" y1="80" x2="45" y2="98" stroke="#0f172a" stroke-width="1.6" />
      <line x1="51" y1="80" x2="51" y2="98" stroke="#0f172a" stroke-width="1.6" />
    </g>
    <text x="16" y="158" class="card-sub">Bidirectional glTF &amp; Explode</text>
  </g>

  <!-- Card 2: Hydraulic Pull Lever -->
  <g transform="translate(245, 20)">
    <rect width="205" height="180" rx="10" class="card-box" />
    <text x="16" y="26" class="card-label">02 · HYDRAULIC PULL LEVER</text>
    <rect x="97" y="48" width="10" height="84" rx="5" fill="#090f1d" stroke="#334155" stroke-width="1.5" />
    <g class="lift-anim">
      <rect x="74" y="78" width="56" height="22" rx="6" fill="#38bdf8" stroke="#0f172a" stroke-width="2" />
      <circle cx="84" cy="89" r="2.5" fill="#0f172a" />
      <circle cx="120" cy="89" r="2.5" fill="#0f172a" />
    </g>
    <text x="16" y="158" class="card-sub">Vertical Metric Elevation Rig</text>
  </g>

  <!-- Card 3: Tactile Rotary Dial -->
  <g transform="translate(470, 20)">
    <rect width="205" height="180" rx="10" class="card-box" />
    <text x="16" y="26" class="card-label">03 · TACTILE ORBIT DIAL</text>
    <circle cx="105" cy="86" r="36" fill="#090f1d" stroke="#334155" stroke-width="2" />
    <circle cx="105" cy="86" r="28" fill="none" stroke="#58ddba" stroke-width="1.5" stroke-dasharray="4 5" />
    <g class="dial-anim">
      <line x1="575" y1="106" x2="575" y2="78" stroke="#58ddba" stroke-width="3.5" stroke-linecap="round" transform="translate(-470, -20)" />
      <circle cx="575" cy="80" r="4" fill="#38bdf8" transform="translate(-470, -20)" />
    </g>
    <text x="16" y="158" class="card-sub">360° Spotlight &amp; Valve Crank</text>
  </g>

  <!-- Card 4: 2-Axis Flight Gimbal Joystick -->
  <g transform="translate(695, 20)">
    <rect width="205" height="180" rx="10" class="card-box" />
    <text x="16" y="26" class="card-label">04 · 2-AXIS GIMBAL STICK</text>
    <circle cx="102" cy="86" r="36" fill="#090f1d" stroke="#334155" stroke-width="2" />
    <line x1="66" y1="86" x2="138" y2="86" stroke="rgba(148,163,184,0.2)" stroke-width="1" />
    <line x1="102" y1="50" x2="102" y2="122" stroke="rgba(148,163,184,0.2)" stroke-width="1" />
    <g class="joy-anim">
      <circle cx="102" cy="86" r="15" fill="#f97316" stroke="#0f172a" stroke-width="2" />
      <circle cx="98" cy="82" r="4" fill="rgba(255,255,255,0.45)" />
    </g>
    <text x="16" y="158" class="card-sub">Turret Seeker &amp; Spring Return</text>
  </g>
</svg>
