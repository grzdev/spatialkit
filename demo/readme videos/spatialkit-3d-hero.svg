<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="320" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="920" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050912" />
      <stop offset="50%" stop-color="#0b1324" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>
    <radialGradient id="glowTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58ddba" stop-opacity="0.28" />
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#050912" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58ddba" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="sliceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#58ddba" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>
    <style>
      .grid-line { stroke: rgba(148, 163, 184, 0.12); stroke-width: 1; }
      .grid-accent { stroke: rgba(88, 221, 186, 0.24); stroke-width: 1.2; }
      .orbit-ring {
        stroke: url(#wireGrad);
        stroke-width: 1.5;
        stroke-dasharray: 8 6;
        animation: spinDash 14s linear infinite;
      }
      .cube-float {
        animation: hoverModel 4.5s ease-in-out infinite;
        transform-origin: 460px 160px;
      }
      .hotspot-pulse {
        animation: pulsePin 2.2s ease-in-out infinite;
      }
      .hotspot-pulse-2 {
        animation: pulsePin 2.2s ease-in-out 0.9s infinite;
      }
      .scan-plane {
        animation: scanY 4.5s ease-in-out infinite;
      }
      .dial-needle {
        transform-origin: 790px 108px;
        animation: rotateDial 6s ease-in-out infinite;
      }
      .lever-knob {
        animation: slideLever 3.8s ease-in-out infinite;
      }
      .reticle-spin {
        transform-origin: 132px 115px;
        animation: spinReticle 8s linear infinite;
      }
      @keyframes spinDash {
        to { stroke-dashoffset: -140; }
      }
      @keyframes hoverModel {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-9px); }
      }
      @keyframes pulsePin {
        0%, 100% { r: 4.5px; opacity: 1; }
        50% { r: 8px; opacity: 0.35; }
      }
      @keyframes scanY {
        0%, 100% { transform: translateY(-28px); opacity: 0.75; }
        50% { transform: translateY(34px); opacity: 0.95; }
      }
      @keyframes rotateDial {
        0%, 100% { transform: rotate(-45deg); }
        50% { transform: rotate(115deg); }
      }
      @keyframes slideLever {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(58px); }
      }
      @keyframes spinReticle {
        to { transform: rotate(360deg); }
      }
      .hud-title { font: 700 10px 'Courier New', monospace; fill: #94a3b8; letter-spacing: 1.4px; }
      .hud-val { font: 700 11px 'Courier New', monospace; fill: #58ddba; }
      .badge-text { font: 700 10px 'Segoe UI', system-ui, sans-serif; fill: #071018; }
      .hero-title { font: 800 28px 'Segoe UI', system-ui, sans-serif; fill: #f8fafc; letter-spacing: -0.5px; }
      .hero-sub { font: 500 13px 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; }
    </style>
  </defs>

  <!-- Outer Card Backdrop -->
  <rect width="920" height="320" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  <circle cx="460" cy="165" r="190" fill="url(#glowTeal)" />

  <!-- Perspective 3D Floor Grid -->
  <g opacity="0.85">
    <ellipse cx="460" cy="238" rx="220" ry="44" class="orbit-ring" />
    <ellipse cx="460" cy="238" rx="150" ry="29" stroke="rgba(56, 189, 248, 0.18)" stroke-width="1" />
    <line x1="210" y1="238" x2="710" y2="238" class="grid-accent" />
    <line x1="460" y1="185" x2="460" y2="292" class="grid-accent" />
    <line x1="270" y1="205" x2="650" y2="271" class="grid-line" />
    <line x1="650" y1="205" x2="270" y2="271" class="grid-line" />
    <line x1="330" y1="196" x2="590" y2="280" class="grid-line" />
    <line x1="590" y1="196" x2="330" y2="280" class="grid-line" />
  </g>

  <!-- ─── LEFT HUD CARD: 3D GIMBAL TRACKER ─── -->
  <g transform="translate(26, 32)">
    <rect width="212" height="162" rx="12" fill="rgba(15, 23, 42, 0.82)" stroke="rgba(56, 189, 248, 0.28)" stroke-width="1.2" />
    <text x="16" y="24" class="hud-title">✦ GIMBAL TARGET LOCK</text>
    <circle cx="106" cy="83" r="40" stroke="rgba(88, 221, 186, 0.25)" stroke-width="1.2" />
    <g class="reticle-spin">
      <circle cx="132" cy="115" r="28" stroke="#58ddba" stroke-width="1.5" stroke-dasharray="12 8" transform="translate(-26, -32)" />
    </g>
    <line x1="58" y1="83" x2="76" y2="83" stroke="#58ddba" stroke-width="1.5" />
    <line x1="136" y1="83" x2="154" y2="83" stroke="#58ddba" stroke-width="1.5" />
    <line x1="106" y1="35" x2="106" y2="53" stroke="#58ddba" stroke-width="1.5" />
    <line x1="106" y1="113" x2="106" y2="131" stroke="#58ddba" stroke-width="1.5" />
    <circle cx="106" cy="83" r="6" fill="#f97316" />
    <circle cx="106" cy="83" r="12" stroke="#f97316" stroke-width="1.2" opacity="0.6" />
    <text x="16" y="148" class="hud-val">LOCK: ACTIVE · 60 FPS</text>
  </g>

  <!-- ─── CENTER: FLOATING 3D ISOMETRIC MODEL + HOTSPOTS + SLICER PLANE ─── -->
  <g class="cube-float">
    <!-- Isometric Outer 3D Assembly Cage -->
    <polygon points="460,68 552,116 552,204 460,252 368,204 368,116" fill="rgba(15, 23, 42, 0.55)" stroke="url(#wireGrad)" stroke-width="2" />
    <polygon points="460,68 552,116 460,164 368,116" fill="rgba(88, 221, 186, 0.12)" stroke="#58ddba" stroke-width="1.5" />
    <polygon points="368,116 460,164 460,252 368,204" fill="rgba(56, 189, 248, 0.08)" stroke="#38bdf8" stroke-width="1.4" />
    <polygon points="552,116 460,164 460,252 552,204" fill="rgba(15, 23, 42, 0.72)" stroke="#58ddba" stroke-width="1.4" />

    <!-- Inner 3D Core Cylinder / Turbine -->
    <ellipse cx="460" cy="132" rx="38" ry="18" fill="rgba(88, 221, 186, 0.22)" stroke="#58ddba" stroke-width="1.6" />
    <path d="M422,132 L422,186 A38,18 0 0,0 498,186 L498,132" fill="rgba(56, 189, 248, 0.18)" stroke="#38bdf8" stroke-width="1.6" />
    <ellipse cx="460" cy="186" rx="38" ry="18" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 3" />

    <!-- Animated Cross-Section Slicing Plane -->
    <g class="scan-plane">
      <polygon points="346,154 460,104 574,154 460,204" fill="url(#sliceGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5 3" />
    </g>

    <!-- Hotspot 1: Top Valve Anchor + Leader Line + Pill -->
    <circle cx="460" cy="116" r="4.5" fill="#58ddba" />
    <circle cx="460" cy="116" r="4.5" fill="#58ddba" class="hotspot-pulse" />
    <polyline points="460,116 410,64 366,64" fill="none" stroke="#58ddba" stroke-width="1.6" />
    <rect x="256" y="50" width="114" height="24" rx="12" fill="#58ddba" />
    <text x="268" y="66" class="badge-text">✦ PRESSURE SEAL</text>

    <!-- Hotspot 2: Right Rotor Anchor + Leader Line + Pill -->
    <circle cx="514" cy="172" r="4.5" fill="#38bdf8" />
    <circle cx="514" cy="172" r="4.5" fill="#38bdf8" class="hotspot-pulse-2" />
    <polyline points="514,172 568,144 602,144" fill="none" stroke="#38bdf8" stroke-width="1.6" />
    <rect x="602" y="131" width="104" height="24" rx="12" fill="#38bdf8" />
    <text x="613" y="147" class="badge-text">✦ ROTOR MESH</text>
  </g>

  <!-- ─── RIGHT HUD CARD: TACTILE ORBIT DIAL & SCRUBBER LEVER ─── -->
  <g transform="translate(682, 32)">
    <rect width="212" height="162" rx="12" fill="rgba(15, 23, 42, 0.82)" stroke="rgba(88, 221, 186, 0.28)" stroke-width="1.2" />
    <text x="16" y="24" class="hud-title">✦ SKEUOMORPHIC RIGS</text>

    <!-- Tactile Rotary Dial -->
    <circle cx="108" cy="76" r="32" fill="#090f1d" stroke="#334155" stroke-width="2" />
    <circle cx="108" cy="76" r="25" fill="none" stroke="#58ddba" stroke-width="1.5" stroke-dasharray="3 5" />
    <g class="dial-needle">
      <line x1="790" y1="108" x2="790" y2="85" stroke="#58ddba" stroke-width="3" stroke-linecap="round" transform="translate(-682, -32)" />
      <circle cx="790" cy="87" r="3.5" fill="#38bdf8" transform="translate(-682, -32)" />
    </g>

    <!-- Mechanical Scrubber Track -->
    <rect x="28" y="128" width="156" height="8" rx="4" fill="#090f1d" stroke="#334155" stroke-width="1.2" />
    <g class="lever-knob">
      <rect x="42" y="121" width="24" height="22" rx="5" fill="#58ddba" stroke="#0f172a" stroke-width="1.5" />
      <line x1="51" y1="126" x2="51" y2="138" stroke="#0f172a" stroke-width="1.5" />
      <line x1="57" y1="126" x2="57" y2="138" stroke="#0f172a" stroke-width="1.5" />
    </g>
  </g>

  <!-- ─── BOTTOM CAPTION BANNER ─── -->
  <text x="460" y="294" text-anchor="middle" class="hero-sub">
    INTERACTIVE 3D INSPECTOR · TACTILE RIG CONTROLS · GUIDED CAMERA TOURS · REACT THREE FIBER
  </text>
</svg>
