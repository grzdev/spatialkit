<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="skBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="skShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Angled Brand Mark Badge -->
  <g transform="rotate(-5, 64, 64)">
    <rect x="20" y="16" width="84" height="92" rx="20" ry="20" fill="url(#skBg)" filter="url(#skShadow)" />
    <rect x="21" y="17" width="82" height="90" rx="19" ry="19" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.32" />
    <text x="60" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="68" font-weight="900" fill="#ffffff" text-anchor="middle">S</text>
  </g>

  <!-- Luminous Diamond Sparkle ◆ at Top-Right -->
  <polygon points="106,14 115,25 106,36 97,25" fill="#38bdf8" />
  <polygon points="106,17 112,25 106,33 100,25" fill="#ffffff" opacity="0.8" />
</svg>